name: Spellcheck
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Spellcheck
        uses: rojopolis/spellcheck-github-actions@ca94733232ec8328061aea8018dfcb4959857eea # 0.61.0
        with:
          config_path: .github/spellcheck-settings.yml
          task_name: Markdown

  # Spellcheck the pull-request title with the same wordlist/dictionary. Because
  # release-plz copies merged commit subjects (= squashed PR titles) verbatim into
  # CHANGELOG.md, an unknown word in a title would only surface — too late — on the
  # release PR. Catching it here keeps every release PR's spellcheck green.
  pr-title:
    name: PR title spelling
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write PR title to a Markdown file
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '# %s\n' "$PR_TITLE" > .pr-title.md
      - name: Spellcheck PR title
        uses: rojopolis/spellcheck-github-actions@ca94733232ec8328061aea8018dfcb4959857eea # 0.61.0
        with:
          config_path: .github/spellcheck-settings.yml
          task_name: PRTitle
